<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment - Utility Service Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navbar Styling */
        #navbar {
            background-color: #333;
            overflow: hidden;
        }

        #navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }

        #navbar a:hover {
            background-color: #575757;
        }

        #navbar a.active {
            background-color: #4CAF50;
        }

        /* Payment Form Styling */
        .payment-container {
            padding: 40px;
            max-width: 500px;
            margin: 40px auto;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #f9f9f9;
        }

        .payment-container h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .payment-container label {
            display: block;
            margin-top: 15px;
        }

        .payment-container input,
        .payment-container select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .payment-container button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .payment-container button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div id="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="nearestservice.html">Nearest Services</a>
        <a href="Predictions.html">Predictions</a>
        <a href="newconnections.html">New Connections</a>
        <a class="active" href="payment.html">Payment</a>
        <a href="login.html">Login</a>
        <a href="contactus.html">Contact Us</a>
    </div>

    <!-- Payment Form Section -->
    <div class="payment-container">
        <h2>Utility Bill Payment</h2>
        <form action="#" method="POST">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="service">Service Type:</label>
            <select id="service" name="service" required>
                <option value="">--Select Service--</option>
                <option value="electricity">Electricity</option>
                <option value="water">Water</option>
                <option value="gas">Gas</option>
            </select>

            <label for="account">Account Number:</label>
            <input type="text" id="account" name="account" required>

            <label for="amount">Amount (₹):</label>
            <input type="number" id="amount" name="amount" required>

            <label for="card">Card Number:</label>
            <input type="text" id="card" name="card" required maxlength="16" minlength="16">

            <label for="expiry">Expiry Date:</label>
            <input type="month" id="expiry" name="expiry" required>

            <label for="cvv">CVV:</label>
            <input type="password" id="cvv" name="cvv" required maxlength="3" minlength="3">

            <button type="submit">Pay Now</button>
        </form>
    </div>

</body>
</html>
