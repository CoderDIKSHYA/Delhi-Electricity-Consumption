<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predictions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
        background-image: url('predict.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
      }
      
    h1 {
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .parameter {
      margin-bottom: 15px;
    }

    .parameter label {
      font-weight: bold;
      display: block;
    }

    .parameter input[type="number"], 
    .parameter input[type="text"] {
      margin-top: 5px;
      padding: 10px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .parameter input[type="checkbox"] {
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #218838;
    }

    #output {
      margin-top: 20px;
      padding: 15px;
      background-color: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>

    <div class="header"></div>
        <div class="flexContainer">
            <div class="flexChild logo">
                <img style="text-align: left;" src="logo22.jpg" id="lol">
            </div>

  <div class="container">
    <h1>Predictions</h1>

    <div class="parameter">
      <label>
        <input type="checkbox" id="tempCheckbox" onclick="toggleInput('tempInput')"> Temperature (°C)
      </label>
      <input type="number" id="tempInput" placeholder="Enter temperature" style="display:none">
    </div>

    <div class="parameter">
      <label>
        <input type="checkbox" id="humidityCheckbox" onclick="toggleInput('humidityInput')"> Humidity (%)
      </label>
      <input type="number" id="humidityInput" placeholder="Enter humidity" style="display:none">
    </div>

    <div class="parameter">
      <label>
        <input type="checkbox" id="dayTypeCheckbox" onclick="toggleInput('dayTypeInput')"> Day Type
      </label>
      <input type="text" id="dayTypeInput" placeholder="Enter day type" style="display:none">
    </div>

    <div class="parameter">
      <label>
        <input type="checkbox" id="monthCheckbox" onclick="toggleInput('monthInput')"> Month
      </label>
      <input type="number" id="monthInput" placeholder="Enter month" style="display:none">
    </div>

    <div class="parameter">
      <label>
        <input type="checkbox" id="dayCheckbox" onclick="toggleInput('dayInput')"> Day
      </label>
      <input type="number" id="dayInput" placeholder="Enter day" style="display:none">
    </div>

    <div class="parameter">
      <label>
        <input type="checkbox" id="dayOfWeekCheckbox" onclick="toggleInput('dayOfWeekInput')"> Day of Week
      </label>
      <input type="text" id="dayOfWeekInput" placeholder="Enter day of the week" style="display:none">
    </div>

    <button onclick="getPredictions()">Predict</button>

    <div id="output"></div>
  </div>

  <script>
    // Function to toggle input visibility when a checkbox is clicked
    function toggleInput(inputId) {
      const input = document.getElementById(inputId);
      input.style.display = input.style.display === 'none' ? 'block' : 'none';
    }

    // Function to get prediction values and display them
    function getPredictions() {
      const output = document.getElementById('output');
      let predictions = {};

      // Collect values for checked inputs
      if (document.getElementById('tempCheckbox').checked) {
        predictions['Temperature (°C)'] = document.getElementById('tempInput').value;
      }
      if (document.getElementById('humidityCheckbox').checked) {
        predictions['Humidity (%)'] = document.getElementById('humidityInput').value;
      }
      if (document.getElementById('dayTypeCheckbox').checked) {
        predictions['Day Type'] = document.getElementById('dayTypeInput').value;
      }
      if (document.getElementById('monthCheckbox').checked) {
        predictions['Month'] = document.getElementById('monthInput').value;
      }
      if (document.getElementById('dayCheckbox').checked) {
        predictions['Day'] = document.getElementById('dayInput').value;
      }
      if (document.getElementById('dayOfWeekCheckbox').checked) {
        predictions['Day of Week'] = document.getElementById('dayOfWeekInput').value;
      }

      // Display the results
      output.style.display = 'block';
      output.innerHTML = '<h3>Prediction Results</h3><pre>' + JSON.stringify(predictions, null, 2) + '</pre>';
    }
  </script>

</body>
</html>
