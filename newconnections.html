<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Connection</title>
    <link href="https://fonts.googleapis.com/css?family=Josefin+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Josefin Sans', sans-serif;
            background-image: url('img8.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-position: center;
            font-size: large;
        }

        nav {
            width: 100%;
            height: 15vh;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
        }

        nav .logo h1 {
            margin: 0;
            font-size: 30px;
        }

        nav .menu a {
            text-decoration: none;
            color: white;
            margin: 0 15px;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        nav .menu a:hover {
            color: #00b894;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.9);
            width: 60%;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .form-container h1 {
            text-align: center;
            color: #c0392b;
            margin-bottom: 30px;
        }

        .inputBox {
            margin-bottom: 20px;
        }

        .inputBox label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .inputBox input[type="text"],
        .inputBox input[type="password"],
        .inputBox input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        button[type="submit"] {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #00b894;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #01906d;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <h1>PEAK SENSE</h1>
        </div>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contactus.html">Contact</a>
        </div>
    </nav>

    <div class="form-container">
        <h1>New Connection Form</h1>
        <form>
            <div class="inputBox">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" placeholder="Full name">
            </div>
            <div class="inputBox">
                <label>First Name:</label>
                <input type="text" placeholder="First Name">
                <label>Last Name:</label>
                <input type="text" placeholder="Last Name">
            </div>
            <div class="inputBox">
                <label for="contact">Contact Number:</label>
                <input type="text" id="contact" placeholder="Enter your number">
            </div>
            <div class="inputBox">
                <label for="dob">Date of Birth:</label>
                <input type="text" id="dob" placeholder="DD/MM/YYYY">
            </div>
            <div class="inputBox">
                <label>Gender:</label>
                <div class="gender-options">
                    <label><input type="radio" name="gender"> Male</label>
                    <label><input type="radio" name="gender"> Female</label>
                    <label><input type="radio" name="gender"> Other</label>
                </div>
            </div>
            <div class="inputBox">
                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="E-mail address">
            </div>
            <div class="inputBox">
                <label>House Number:</label>
                <input type="text" placeholder="House No.">
            </div>
            <div class="inputBox">
                <label>House Document Number:</label>
                <input type="text" placeholder="Document No.">
            </div>
            <div class="inputBox">
                <label>How Many UNITS Connection Needed:</label>
                <input type="text" placeholder="Enter number">
            </div>
            <div class="inputBox">
                <label>Username:</label>
                <input type="text" placeholder="Username">
                <label>Password:</label>
                <input type="password" placeholder="Password">
            </div>
            <div class="inputBox">
                <button type="submit">SUBMIT</button>
            </div>
        </form>
    </div>

</body>
</html>
