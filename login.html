
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-image: url('delhi.jpg');
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-position: center;
  background-size: cover;
  background-color: #000;
  margin: 0;
}

/* Input fields */
input[type=text], input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #777;
  box-sizing: border-box;
  border-radius: 5px;
  background-color: #f2f2f2;
  transition: 0.3s ease-in-out;
}

input[type=text]:focus, input[type=password]:focus {
  border-color: #00cfff;
  box-shadow: 0 0 8px #00cfff;
}

/* Button styles */
button {
  background-color: #0078D7;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
  border-radius: 4px;
  font-weight: bold;
  transition: background 0.3s;
}

button:hover {
  background-color: #005bb5;
}

.cancelbtn {
  background-color: #ff5722;
  padding: 10px 18px;
  width: auto;
  border-radius: 4px;
}

.cancelbtn:hover {
  background-color: #e64a19;
}

.imgcontainer {
  text-align: center;
  margin: 24px 0 12px 0;
}

img.avatar {
  width: 30%;
  border-radius: 50%;
  box-shadow: 0 0 12px #00cfff;
}

.container {
  padding: 16px;
}

/* Modal styling */
.modal {
  display: block;
  position: fixed;
  z-index: 1;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0, 0, 0, 0.75);
  padding-top: 60px;
}

.modal-content {
  background-color: #121212;
  margin: 5% auto;
  border: 1px solid #444;
  width: 30%;
  border-radius: 10px;
  box-shadow: 0 0 20px #00cfff;
  color: #eee;
}

.close {
  position: absolute;
  right: 25px;
  top: 0;
  color: #f1f1f1;
  font-size: 35px;
  font-weight: bold;
}

.close:hover,
.close:focus {
  color: #ff5722;
  cursor: pointer;
}

.animate {
  animation: animatezoom 0.6s;
}

@keyframes animatezoom {
  from {transform: scale(0)}
  to {transform: scale(1)}
}

@media screen and (max-width: 600px) {
  .modal-content {
    width: 90%;
  }
  .cancelbtn {
    width: 100%;
  }
  span.psw {
    display: block;
    float: none;
    text-align: center;
    padding-top: 10px;
  }
}
</style>
</head>
<body>

<div id="id01" class="modal">
  <form class="modal-content animate" method="post">
    <div class="imgcontainer">
      <img src="azadi-1.jpg" alt="Avatar" class="avatar">
    </div>

    

    <div class="container">
      <label for="uname"><b>Username</b></label>
      <input type="text" placeholder="Enter Username" name="uname" required>

      <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" name="psw" required>

      <button type="submit">Login</button>
      <label>
        <input type="checkbox" checked="checked" name="remember"> Remember me
      </label>
    </div>

    <div class="container" style="background-color:#1e1e1e; border-top: 1px solid #333;">
      <button type="button" onclick="location.href='index.html';" class="cancelbtn">Cancel</button>
      <span class="psw">Forgot <a href="#" style="color:#00cfff;">password?</a></span>
    </div>
  </form>
</div>

</body>
</html>
